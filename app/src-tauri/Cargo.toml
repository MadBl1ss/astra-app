[package]
name = "strelka"
version = "0.1.0"
description = "Strelka: the window and the tray icon of the VPN client"
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
# The bridge to the daemon: a named pipe on Windows, a unix socket on Linux.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "strelka"
version = "0.1.0"
description = "Strelka: the window and the tray icon of the VPN client"
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
# The fallback for toasts: the system's own notifications.
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
# The bridge to the daemon: a named pipe on Windows, a unix socket on Linux.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }

# The toast window is shown without taking the focus, which Tauri cannot do
# by itself; the same version as Tauri's own, so it is built once.
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
